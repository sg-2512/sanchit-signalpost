name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --locked --group dev
      - name: Verify committed strategy integrity manifest
        run: uv run --no-sync python -m strategies.freeze --verify
      - name: Run offline regression suite
        run: uv run --no-sync python -m pytest tests/ -q
