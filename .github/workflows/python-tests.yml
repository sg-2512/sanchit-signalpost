name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --locked --group dev
      - name: Print refreshed strategy manifest (temporary)
        run: |
          uv run --no-sync python -m strategies.freeze --freeze
          cat snapshots/strategy_manifest.json
      - name: Run offline regression suite
        run: uv run --no-sync python -m pytest tests/ -q
